name: tests

on:
  push:
  pull_request:

# nothing here writes to the repo: the token reads, no more
permissions:
  contents: read

jobs:
  lint:
    name: undefined names (pyflakes)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyflakes
      # the suite never imports most of the glue, so this is the only thing
      # that catches a NameError there before a user does
      - run: python -m pyflakes due_crew tests tools

  suite:
    name: client suite (fake Worker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 tests/test_due_crew.py
      - run: python3 tests/test_planner.py  # labs: the plan window (docs/planner.md)
      - run: python3 tests/test_plan_web.py  # the HTML plan window: its clicks, views and page
      - run: python3 tests/test_plan_web_tabs.py  # its Insights and Settings: views, clicks, the page run in node
      - run: python3 tests/test_plan_ops.py  # round five: plan changes as ops, waiting to be sent
      - run: python3 tests/test_where.py  # 3.9.5: Study where the cards are (QBank's topics)
      - run: python3 tests/test_habits.py  # 3.9.5: How you study, from my own log (never sent)
      - run: python3 tests/test_plan_board.py  # plans, end to end: You › Plans' path, Behind…, the empty tab
      - run: python3 tests/test_lesson_decks.py  # Today's lesson, B: each open lesson a deck of its own (never sent)
      - run: python3 tests/test_plan_joy.py  # 3.9.6: the plan joys (a set done, milestones, the finish, caught up, day one)
      - run: python3 tests/test_songs.py  # 3.9.6: song of the moment (the song, the catalog, Listen, the floor's view)
      - run: python3 tests/test_dance_floor.py  # 3.9.6: the dance floor on the Decks screen, its card and search
      - run: python3 tests/test_magic.py  # 3.9.7: Magic search (what a box says, the window's logic, its ways in)

  dialogs:
    name: dialogs build (offscreen PyQt6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libglib2.0-0 libdbus-1-3 libfontconfig1 libxcb-cursor0
      # 6.12.0 (28 Oct 2026) ships without QtPdf, which the dropped calendar PDF is read with;
      # Anki brings its own Qt, so this is the newest that has every module the add-on uses
      - run: pip install "PyQt6==6.11.0"
      - run: QT_QPA_PLATFORM=offscreen python3 tools/dialogs.py dialog-shots
      - uses: actions/upload-artifact@v7
        with:
          name: dialog-shots
          path: dialog-shots

  # The robot click-test (tools/click_test.py): real Anki 25.02.7, offscreen,
  # signed in to the suite's fake server in its own process. It presses every
  # control the board shows, opens its windows, makes and sends a plan,
  # studies a deck and sits a minute at rest; it fails on a press that reaches
  # no handler, anything raised, a slow first card or CPU at rest. No network
  # once it runs (pip and apt before it only). Its report and screenshots are
  # the artifact, red or green.
  click:
    name: click test (real Anki)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # the dialogs job's libraries, and what QtWebEngine's Chromium needs besides
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libglib2.0-0 libdbus-1-3 libfontconfig1 libxcb-cursor0 \
            libnss3 libnspr4 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libxkbfile1 libgbm1 libdrm2 libx11-xcb1
      # Anki's own wheels; aqt asks only for PyQt6>=6.2, so the Qt is pinned to
      # 6.11 (the dialogs job's: 6.12.0 has no QtPdf), the pair it was proven on
      - run: pip install "aqt==25.02.7" "anki==25.02.7" "PyQt6==6.11.0" "PyQt6-WebEngine==6.11.0"
      # 3.9.9: what a person waits on, on a big collection (30,000 notes, a million answers), each
      # against its budget; over one marked fail is red, as a failing test is (tools/speed_budget.py)
      - name: speed budget
        run: python3 tools/speed_budget.py
      - name: click test
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
        run: python3 tools/click_test.py --out click-test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: click-test
          path: click-test

  # 3.0: the Worker (worker/) in real workerd with a local D1.
  worker:
    name: worker (vitest, workerd + D1)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      # the real client against the real Worker: where the suite's fake and
      # the Worker's own tests each prove one side, this proves they agree
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: npx wrangler d1 migrations apply due-crew --local --env=""
      - name: client against the Worker (wrangler dev, local D1)
        run: |
          npx wrangler dev --env="" --local --port 8787 --ip 127.0.0.1 --var DEV_MAIL_LOG:1 > ../wdev.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8787/version && break; sleep 1; done
          cd .. && python3 tools/smoke_worker.py wdev.log

  # 3.0: a v* tag deploys the Worker, after every other job is green. The
  # database migrates first; both are no-ops when nothing changed. Until
  # the Cloudflare secrets exist (docs/cloudflare-setup.md) it says so and
  # stands down, so a tag without them stays green.
  deploy:
    name: deploy worker (v* tags)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, suite, dialogs, click, worker]
    runs-on: ubuntu-24.04
    environment: production
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false  # this job holds the Cloudflare secrets: no shared cache
      - name: Cloudflare set up?
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] \
             || grep -m1 'database_id' wrangler.toml | grep -q '00000000-0000'; then
            echo "::notice::Worker not deployed: Cloudflare isn't set up yet (docs/cloudflare-setup.md)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'true'
        run: npm ci
      - if: steps.ready.outputs.go == 'true'
        run: npx wrangler d1 migrations apply due-crew --remote --env=""
      - if: steps.ready.outputs.go == 'true'
        run: npx wrangler deploy --env=""
      - if: steps.ready.outputs.go == 'true'
        name: The API answers
        run: curl -fsS https://api.duecrew.com/version
      - if: steps.ready.outputs.go == 'true'
        name: "duecrew.com (site/, after the API: its /api binds to it)"
        run: npx wrangler deploy --config ../site/wrangler.toml
