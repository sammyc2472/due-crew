name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    name: undefined names (pyflakes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyflakes
      # the suite never imports most of the glue, so this is the only thing
      # that catches a NameError there before a user does
      - run: python -m pyflakes due_crew tests tools

  suite:
    name: client suite (fake Worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tests/test_due_crew.py

  dialogs:
    name: dialogs build (offscreen PyQt6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libglib2.0-0 libdbus-1-3 libfontconfig1 libxcb-cursor0
      - run: pip install PyQt6
      - run: QT_QPA_PLATFORM=offscreen python3 tools/dialogs.py dialog-shots
      - uses: actions/upload-artifact@v4
        with:
          name: dialog-shots
          path: dialog-shots

  rules:
    name: rules (Firestore emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g firebase-tools
      - run: firebase emulators:exec --only firestore --project demo-due-crew "python3 tests/rules/emulator_rules_test.py"

  # 3.0: the Worker (worker/) in real workerd with a local D1. It replaces
  # the rules job once 3.0 ships; until then both run.
  worker:
    name: worker (vitest, workerd + D1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      # the real client against the real Worker: where the suite's fake and
      # the Worker's own tests each prove one side, this proves they agree
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: npx wrangler d1 migrations apply due-crew --local --env=""
      - name: client against the Worker (wrangler dev, local D1)
        run: |
          npx wrangler dev --env="" --local --port 8787 --ip 127.0.0.1 > ../wdev.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8787/version && break; sleep 1; done
          cd .. && python3 tools/smoke_worker.py wdev.log

  # 3.0: a v* tag deploys the Worker, after all five jobs are green. The
  # database migrates first; both are no-ops when nothing changed. Until
  # the Cloudflare secrets exist (docs/cloudflare-setup.md) it says so and
  # stands down, so 2.x release tags stay green.
  deploy:
    name: deploy worker (v* tags)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, suite, dialogs, rules, worker]
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cloudflare set up?
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] \
             || grep -m1 'database_id' wrangler.toml | grep -q '00000000-0000'; then
            echo "::notice::Worker not deployed: Cloudflare isn't set up yet (docs/cloudflare-setup.md)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'true'
        run: npm ci
      - if: steps.ready.outputs.go == 'true'
        run: npx wrangler d1 migrations apply due-crew --remote --env=""
      - if: steps.ready.outputs.go == 'true'
        run: npx wrangler deploy --env=""
      - if: steps.ready.outputs.go == 'true'
        name: The API answers
        run: curl -fsS https://api.duecrew.com/version
