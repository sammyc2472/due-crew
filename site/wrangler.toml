# duecrew.com: static files, plus a small Worker (src/index.ts) that sends
# /api/* to the API Worker and serves the app page. Deploys with the API on
# a v* tag; by hand: `npx wrangler deploy --config ../site/wrangler.toml`
# from worker/ (the API must be deployed first: the service binding needs it).
name = "due-crew-site"
main = "src/index.ts"
compatibility_date = "2026-08-20"
routes = [
  { pattern = "duecrew.com", custom_domain = true },
  { pattern = "www.duecrew.com", custom_domain = true },
]

# Workers Logs: what the code logs (errors, the bridge's counts), kept a few
# days in the dashboard. Not each request: URLs carry friend and plan codes,
# and CLAUDE.md says codes are never logged.
[observability]
enabled = true

[observability.logs]
invocation_logs = false

[assets]
directory = "./public"
binding = "ASSETS"
# "/" too (3.2): signed in, it sends you to your home instead of the landing page
run_worker_first = ["/", "/api/*", "/sign-in", "/account", "/home", "/log", "/admin", "/library", "/plans", "/plans/*", "/p/*"]

[[services]]
binding = "API"
service = "due-crew-api"
