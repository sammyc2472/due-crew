# Due Crew API: one Worker, D1 underneath, at api.duecrew.com.
# Setup, once: docs/cloudflare-setup.md. Deploys run from CI on a v* tag.
name = "due-crew-api"
main = "src/index.ts"
compatibility_date = "2026-08-20"
workers_dev = false
routes = [{ pattern = "api.duecrew.com", custom_domain = true }]

[vars]
API_VERSION = "1"
MIN_CLIENT = "3.0.0"
MAIL_FROM = "Due Crew <codes@duecrew.com>"

# Secrets (wrangler secret put): ADMIN_TOKEN (the one-shot identity import;
# unset: no admin). RESEND_API_KEY only if mail ever moves off the EMAIL
# binding below.

[[d1_databases]]
binding = "DB"
database_name = "due-crew"
database_id = "64b685e7-9051-45e0-9511-5124cbf1280c"
migrations_dir = "migrations"

# Sign-in codes by Cloudflare Email Service, and only from this address.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["codes@duecrew.com"]

# Housekeeping, daily: spent codes, old rate-limit windows, idle sessions.
[triggers]
crons = ["17 4 * * *"]

# A second Worker and database for trying a client before the crew does:
# `wrangler deploy --env dev`, served at api-dev.duecrew.com.
[env.dev]
name = "due-crew-api-dev"
routes = [{ pattern = "api-dev.duecrew.com", custom_domain = true }]

[env.dev.vars]
API_VERSION = "1"
MIN_CLIENT = "3.0.0"
MAIL_FROM = "Due Crew <codes@duecrew.com>"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "due-crew-dev"
database_id = "693a0afd-6164-4637-9ad9-6f04a97e38a8"
migrations_dir = "migrations"

[env.dev.triggers]
crons = ["17 4 * * *"]

[[env.dev.send_email]]
name = "EMAIL"
allowed_sender_addresses = ["codes@duecrew.com"]
